name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Weekly rebuild so the image picks up the latest yt-dlp (it goes stale
  # against YouTube quickly). Mondays 09:00 UTC.
  schedule:
    - cron: "0 9 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check yt-dlp version
        id: ytdlp
        run: |
          latest=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          # Pushes to main and manual runs always build; scheduled runs
          # build only when PyPI has a newer yt-dlp than the published image.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          current=$(docker buildx imagetools inspect akshaykannan/video-analysis:latest \
            --format '{{json .Image}}' \
            | jq -r '.["linux/amd64"].config.Labels["ytdlp.version"] // ""' || true)
          echo "published=$current latest=$latest"
          if [ "$current" = "$latest" ]; then
            echo "yt-dlp unchanged; skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.ytdlp.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: akshaykannan/video-analysis:latest
